name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  code-linting:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and Dependencies
        uses: $/.github/actions/setup-node

      - name: Run ESLint
        run: yarn lint

  code-security-audit:
    name: Code Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and Dependencies
        uses: $/.github/actions/setup-node

      - name: Run security audit
        run: yarn npm audit

  mocha-unit-tests:
    name: Mocha Unit Tests
    uses: $/.github/workflows/mocha.yml

  playwright:
    name: Playwright Tests
    uses: $/.github/workflows/playwright.yml

  cp-build-push-scan-and-deploy:
    name: Build, Push, Scan and Deploy to Cloud Platform
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/cp-build-push-deploy.yml@8e902f54ebf3350ad43dbdc1f475322cc31967c6 # v0.2.0
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    with:
      app_name: laa-express-typescript-template
      helm_release_name: laa-express-typescript-template
      helm_chart: ./laa-generic-helm-chart
      helm_values_path: ./deploy/your-repo-name/values/values-dev.yaml
      ecr_repository: ${{ vars.DEV_ECR_REPOSITORY }}
    secrets:
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      ECR_ROLE_TO_ASSUME: ${{ secrets.DEV_ECR_ROLE_TO_ASSUME }}
      KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
      KUBE_NAMESPACE: ${{ secrets.DEV_KUBE_NAMESPACE }}
      KUBE_TOKEN: ${{ secrets.DEV_KUBE_TOKEN }}
      KUBE_CERT: ${{ secrets.DEV_KUBE_CERT }}

  generate-sbom:
    name: Generate Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Set up AWS credentials for ECR and Kubernetes
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Generate Syft SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          output-file: sbom-${{ github.sha }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}.spdx.json
          path: sbom-${{ github.sha }}.spdx.json

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-name: ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}
          subject-path: sbom-${{ github.sha }}.spdx.json
          sbom-path: sbom-${{ github.sha }}.spdx.json
