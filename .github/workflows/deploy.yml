name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  code-linting:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and Dependencies
        uses: $/.github/actions/setup-node

      - name: Run ESLint
        run: yarn lint

  code-security-audit:
    name: Code Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and Dependencies
        uses: $/.github/actions/setup-node

      - name: Run security audit
        run: yarn npm audit

  mocha-unit-tests:
    name: Mocha Unit Tests
    uses: $/.github/workflows/mocha.yml

  playwright:
    name: Playwright Tests
    uses: $/.github/workflows/playwright.yml

  cp-build-push-scan-and-deploy:
    name: Build, Push, Scan and Deploy to Cloud Platform
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/cp-build-push-deploy.yml@8e902f54ebf3350ad43dbdc1f475322cc31967c6 # v0.2.0
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    with:
      app_name: laa-express-typescript-template
      helm_release_name: laa-express-typescript-template
      helm_chart: ./laa-generic-helm-chart
      helm_values_path: ./deploy/your-repo-name/values/values-dev.yaml
      ecr_repository: ${{ vars.DEV_ECR_REPOSITORY }}
    secrets:
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      ECR_ROLE_TO_ASSUME: ${{ secrets.DEV_ECR_ROLE_TO_ASSUME }}
      KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
      KUBE_NAMESPACE: ${{ secrets.DEV_KUBE_NAMESPACE }}
      KUBE_TOKEN: ${{ secrets.DEV_KUBE_TOKEN }}
      KUBE_CERT: ${{ secrets.DEV_KUBE_CERT }}
